<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anapoima en Marcha - Gestión Social</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #f97316;
            /* Orange 500 */
            --primary-dark: #ea580c;
            /* Orange 600 */
            --secondary: #0f172a;
            /* Slate 900 */
            --bg: #f8fafc;
            /* Slate 50 */
            --surface: #ffffff;
            --text: #1e293b;
            /* Slate 800 */
            --text-light: #64748b;
            /* Slate 500 */
            --border: #e2e8f0;
            /* Slate 200 */
            --success: #10b981;
            --danger: #ef4444;
            --radius: 0.75rem;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: --bg;
            color: var(--text);
            background: var(--bg);
        }

        /* Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: var(--surface);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--secondary);
        }

        .brand span {
            color: var(--primary);
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: var(--secondary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
        }

        /* Main Content */
        main {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        /* Dashboard Header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .page-title p {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        /* Buttons */
        .btn {
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(249, 115, 22, 0.2);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: white;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: var(--bg);
        }

        /* KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card h3 {
            color: var(--text-light);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .card .value {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .card .icon-box {
            float: right;
            width: 40px;
            height: 40px;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Filters */
        .filter-bar {
            background: var(--surface);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .form-control {
            padding: 0.625rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-family: inherit;
            font-size: 0.875rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--primary);
            ring: 2px solid rgba(249, 115, 22, 0.1);
        }

        /* Table */
        .table-container {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 1rem;
            background: var(--bg);
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f8fafc;
        }

        /* Tags */
        .tag {
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .tag-blue {
            background: #e0f2fe;
            color: #0284c7;
        }

        .tag-green {
            background: #dcfce7;
            color: #16a34a;
        }

        .tag-yellow {
            background: #fef9c3;
            color: #ca8a04;
        }

        .tag-red {
            background: #fee2e2;
            color: #dc2626;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: var(--radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: scale(0.95);
            transition: transform 0.3s;
            padding: 2rem;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        /* Loading Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        /* Search Suggestions */
        .search-container {
            position: relative;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            box-shadow: var(--shadow);
            max-height: 200px;
            overflow-y: auto;
            z-index: 50;
            display: none;
            margin-top: 4px;
        }

        .suggestions-list.active {
            display: block;
        }

        .suggestion-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: var(--bg);
            color: var(--primary);
        }

        /* Mobile Optimizations */
        @media (max-width: 640px) {
            main {
                padding: 1rem;
            }

            header {
                padding: 1rem;
            }

            .form-control,
            .btn,
            select,
            input {
                font-size: 16px !important;
                /* Prevent iOS Zoom */
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .page-header .btn {
                width: 100%;
                justify-content: center;
            }

            .filter-bar {
                flex-direction: column;
                gap: 1rem;
            }

            .modal {
                padding: 1.5rem;
                width: 95%;
            }

            .kpi-grid {
                grid-template-columns: 1fr;
            }

            /* Responsive Table Card */
            .table-responsive {
                border: 0;
            }

            #pagination-controls {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>

                    </div>
                </div>

                <!-- KPIs -->
                <div class="kpi-grid">
                    <div class="card">
                        <div class="icon-box" style="background: #fff7ed; color: var(--primary);"><i
                                class="fa-solid fa-users"></i></div>
                        <h3>Total Beneficiarios</h3>
                        <div class="value" id="kpi-total">0</div>
                        <div style="color: var(--success); font-size: 0.75rem; margin-top: 0.5rem;"><i
                                class="fa-solid fa-arrow-trend-up"></i> Registros totales</div>
                    </div>
                    <div class="card">
                        <div class="icon-box" style="background: #eff6ff; color: #3b82f6;"><i
                                class="fa-solid fa-building"></i></div>
                        <h3>Sectores Activos</h3>
                        <div class="value" id="kpi-sectores">0</div>
                        <div style="color: var(--text-light); font-size: 0.75rem; margin-top: 0.5rem;">Cobertura
                            territorial</div>
                    </div>

                </div>

                <!-- Filters -->
                <div class="filter-bar">
                    <div class="form-group" style="flex: 2;">
                        <label>Buscar</label>
                        <div class="search-container">
                            <i class="fa-solid fa-search"
                                style="position: absolute; left: 12px; top: 12px; color: var(--text-light); z-index: 10;"></i>
                            <input type="text" id="search-input" class="form-control" style="padding-left: 2.5rem;"
                                placeholder="Buscar por nombre..." autocomplete="off">
                            <div id="suggestions" class="suggestions-list"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Sector</label>
                        <select id="filter-sector" class="form-control">
                            <option value="">Todos los Sectores</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Secretaría</label>
                        <select id="filter-secretaria" class="form-control">
                            <option value="">Todas las Secretarías</option>
                        </select>
                    </div>
                </div>

                <!-- Pagination Controls -->
                <div id="pagination-controls" class="hidden"
                    style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);">
                    <div id="pagination-info" style="font-size: 0.875rem; color: var(--text-light);">
                        Mostrando 0-0 de 0 resultados
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-outline" onclick="changePage(-1)" id="btn-prev" disabled>
                            <i class="fa-solid fa-chevron-left"></i> Anterior
                        </button>
                        <button class="btn btn-outline" onclick="changePage(1)" id="btn-next" disabled>
                            Siguiente <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <div id="loading-spinner" class="text-center" style="padding: 3rem;">
                        <div class="spinner"></div>
                        <p style="margin-top: 1rem; color: var(--text-light);">Cargando datos...</p>
                    </div>
                    <div class="table-responsive">
                        <table id="data-table" class="hidden">
                            <thead>
                                <tr id="table-headers">
                                    <!-- Headers will be injected here -->
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <!-- Data will be injected here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="no-results" class="hidden text-center" style="padding: 2rem; color: var(--text-light);">
                        No se encontraron registros.
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Form Modal -->
    <div class="modal-overlay" id="form-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Nuevo Registro</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="entry-form" onsubmit="handleFormSubmit(event)">
                <div id="form-fields">
                    <!-- Form fields generated dynamically -->
                </div>

                <!-- Custom dynamic fields for Sector/Secretaria -->
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="sector-input">Sector</label>
                    <input list="sector-list" id="sector-input" name="Sector" class="form-control"
                        placeholder="Escriba o seleccione un sector" required>
                    <datalist id="sector-list">
                        <!-- Options populated via JS -->
                    </datalist>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="secretaria-input">Secretaría / Dirección</label>
                    <input list="secretaria-list" id="secretaria-input" name="Secretaria" class="form-control"
                        placeholder="Escriba o seleccione una secretaría" required>
                    <datalist id="secretaria-list">
                        <!-- Options populated via JS -->
                    </datalist>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // State
        let allData = [];
        let displayedData = []; // Filtered data
        let headers = [];
        let sectors = new Set();
        let secretarias = new Set();

        // Pagination State
        let currentPage = 1;
        const itemsPerPage = 20;

        // Init
        window.addEventListener('scroll', () => {
            document.querySelector('header').classList.toggle('scrolled', window.scrollY > 0);
        });

        window.onload = function () {
            loadData();
            loadDropdownOptions();
        };

        // Data Fetching
        function loadData() {
            document.getElementById('loading-spinner').classList.remove('hidden');
            document.getElementById('data-table').classList.add('hidden');
            document.getElementById('pagination-controls').classList.add('hidden');

            google.script.run
                .withSuccessHandler(renderData)
                .withFailureHandler(showError)
                .getData();
        }

        function loadDropdownOptions() {
            google.script.run
                .withSuccessHandler(populateDropdowns)
                .getDropdownOptions();
        }

        function renderData(response) {
            allData = response.data;
            headers = response.headers;

            // Set displayed data to full set initially
            displayedData = [...allData];

            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('data-table').classList.remove('hidden');

            renderHeaders();

            // Update UI
            updateKPIs(displayedData);
            generateFormFields();

            // Render first page
            currentPage = 1;
            renderPagination();
        }

        function renderPagination() {
            const totalItems = displayedData.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

            // Validate current page
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, totalItems);

            const pageData = displayedData.slice(startIndex, endIndex);

            renderTable(pageData);

            // Update Controls
            const paginationControls = document.getElementById('pagination-controls');
            if (totalItems > 0) {
                paginationControls.classList.remove('hidden');

                // Update text "Mostrando X-Y de Z"
                document.getElementById('pagination-info').textContent =
                    `Mostrando ${startIndex + 1}-${endIndex} de ${totalItems} resultados`;

                // Update buttons
                document.getElementById('btn-prev').disabled = currentPage === 1;
                document.getElementById('btn-next').disabled = currentPage === totalPages;
            } else {
                paginationControls.classList.add('hidden');
            }
        }

        function changePage(delta) {
            currentPage += delta;
            renderPagination();
            // Scroll to top of table
            document.querySelector('.table-container').scrollIntoView({ behavior: 'smooth' });
        }

        function renderHeaders() {
            const headerRow = document.getElementById('table-headers');
            headerRow.innerHTML = '';
            headers.forEach(h => {
                const th = document.createElement('th');
                th.textContent = h;
                headerRow.appendChild(th);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                document.getElementById('no-results').classList.remove('hidden');
                return;
            } else {
                document.getElementById('no-results').classList.add('hidden');
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                item.values.forEach(val => {
                    const td = document.createElement('td');
                    // Simple status styling logic
                    if (val === 'Entregado' || val === 'Activo') {
                        td.innerHTML = `<span class="tag tag-green">${val}</span>`;
                    } else if (val === 'Pendiente') {
                        td.innerHTML = `<span class="tag tag-yellow">${val}</span>`;
                    } else if (val === 'Rechazado') {
                        td.innerHTML = `<span class="tag tag-red">${val}</span>`;
                    } else {
                        td.textContent = val;
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        // Search Suggestions Logic
        const searchInput = document.getElementById('search-input');
        const suggestionsList = document.getElementById('suggestions');

        searchInput.addEventListener('input', function () {
            const query = this.value.toLowerCase();

            // Filter main data first
            filterData();

            // Handle Suggestions
            if (query.length < 1) {
                suggestionsList.classList.remove('active');
                return;
            }

            // Assume Column 0 is Name (or find 'Nombre' header)
            // We use displayedData (already filtered by other filters) to suggest relevant names
            const matches = allData.filter(item => {
                const name = item.values[0] ? String(item.values[0]).toLowerCase() : '';
                return name.includes(query);
            }).slice(0, 5); // Take top 5

            if (matches.length > 0) {
                suggestionsList.innerHTML = '';
                matches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    const name = match.values[0] || 'Sin Nombre';
                    // Highlight match
                    div.innerHTML = name.replace(new RegExp(query, 'gi'), (str) => `<b>${str}</b>`);

                    div.onclick = () => {
                        searchInput.value = name;
                        suggestionsList.classList.remove('active');
                        filterData();
                    };
                    suggestionsList.appendChild(div);
                });
                suggestionsList.classList.add('active');
            } else {
                suggestionsList.classList.remove('active');
            }
        });

        // Close suggestions when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !suggestionsList.contains(e.target)) {
                suggestionsList.classList.remove('active');
            }
        });

        document.getElementById('filter-sector').addEventListener('change', filterData);
        document.getElementById('filter-secretaria').addEventListener('change', filterData);

        function filterData() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const sector = document.getElementById('filter-sector').value.toLowerCase();
            const secFilter = document.getElementById('filter-secretaria').value.toLowerCase();

            const filtered = allData.filter(item => {
                const rowString = item.values.join(' ').toLowerCase();
                // Assuming strict column orders for filters might be risky without knowing headers exactly.
                // For now, simple text match across the row for search, and loose match for others if we knew columns.
                // Let's rely on text search mostly, but if we can identify columns D/E from headers:

                // Try to identify indices if headers exist
                // Default assumption: Col D (3) is Sector, Col E (4) is Secretaria (from user prompt)
                const sectorVal = item.values[3] ? String(item.values[3]).toLowerCase() : '';
                const secVal = item.values[4] ? String(item.values[4]).toLowerCase() : '';

                const matchesSearch = rowString.includes(query);
                const matchesSector = sector === '' || sectorVal.includes(sector);
                const matchesSec = secFilter === '' || secVal.includes(secFilter);

                return matchesSearch && matchesSector && matchesSec;
            });

            displayedData = filtered; // Update displayed data source

            // Reset to page 1 for new search results
            currentPage = 1;
            renderPagination();

            updateKPIs(filtered);
        }

        function populateDropdowns(options) {
            // 1. Populate Filters
            const sectorFilter = document.getElementById('filter-sector');
            const secFilter = document.getElementById('filter-secretaria');

            // Clear except first
            while (sectorFilter.options.length > 1) sectorFilter.remove(1);
            while (secFilter.options.length > 1) secFilter.remove(1);

            options.sectores.forEach(s => {
                sectorFilter.add(new Option(s, s));
            });
            options.secretarias.forEach(s => {
                secFilter.add(new Option(s, s));
            });

            // 2. Populate Form Datalists
            const sectorList = document.getElementById('sector-list');
            const secList = document.getElementById('secretaria-list');

            sectorList.innerHTML = '';
            secList.innerHTML = '';

            options.sectores.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                sectorList.appendChild(opt);
            });
            options.secretarias.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                secList.appendChild(opt);
            });
        }

        // Form Generation
        function generateFormFields() {
            const container = document.getElementById('form-fields');
            container.innerHTML = '';

            headers.forEach((h, index) => {
                // Skip Sector (3) and Secretaria (4) as they are handled manually
                if (index === 3 || index === 4) return;

                const div = document.createElement('div');
                div.className = 'form-group';
                div.style.marginBottom = '1rem';

                const label = document.createElement('label');
                label.textContent = h;

                const input = document.createElement('input');
                input.className = 'form-control';
                input.name = h; // Send header name as key
                input.required = true;

                div.appendChild(label);
                div.appendChild(input);
                container.appendChild(div);
            });
        }

        // Modal Actions
        function openModal() {
            document.getElementById('form-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('form-modal').classList.remove('active');
            document.getElementById('entry-form').reset();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('save-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Guardando...';
            btn.disabled = true;

            // Collect data
            const formData = {};
            const inputs = e.target.querySelectorAll('input, select');
            inputs.forEach(input => {
                if (input.name) {
                    formData[input.name] = input.value;
                }
            });

            // Handle the custom named inputs mapping to headers
            // We know headers[3] is Sector and headers[4] is Secretaria usually
            if (headers[3]) formData[headers[3].toString()] = document.getElementById('sector-input').value;
            if (headers[4]) formData[headers[4].toString()] = document.getElementById('secretaria-input').value;

            google.script.run
                .withSuccessHandler(() => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                    closeModal();
                    // Reload everything to get new data and update dropdowns
                    loadData();
                    loadDropdownOptions();
                    alert('Registro guardado correctamente');
                })
                .withFailureHandler((err) => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                    alert('Error al guardar: ' + err);
                })
                .saveData(formData);
        }

        function updateKPIs(data) {
            // Calculate unique beneficiaries by Document (assuming header contains 'Documento' or 'Cédula')
            // If not found, use Column 1 (index 1) as fallback for Document
            let docIndex = headers.findIndex(h => h.toLowerCase().includes('documento') || h.toLowerCase().includes('cédula'));
            if (docIndex === -1) docIndex = 1; // Fallback to 2nd column

            const uniqueDocs = new Set(data.map(d => d.values[docIndex]));
            document.getElementById('kpi-total').textContent = uniqueDocs.size.toLocaleString();

            // Calculate active sectors (unique col 3 - Sector)
            const uniqueSectors = new Set(data.map(d => d.values[3]));
            document.getElementById('kpi-sectores').textContent = uniqueSectors.size;

            // Calculate "Entregado" percentage (assuming Col F/5 is Status or Benefit??)
            // Let's guess 'Estado' is in the headers.
            const statusIndex = headers.findIndex(h => h.toLowerCase().includes('estado'));
            if (statusIndex !== -1) {
                const entregados = data.filter(d => d.values[statusIndex] === 'Entregado').length;
                const total = data.length;
                const percent = total > 0 ? ((entregados / total) * 100).toFixed(1) : 0;
                document.getElementById('kpi-entregas').textContent = percent + '%';
            }
        }

        function showError(err) {
            console.error(err);
            document.getElementById('loading-spinner').innerHTML = `<p style="color:red">Error: ${err.message}</p>`;
        }

    </script>
</body>

</html>
